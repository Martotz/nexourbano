# M7 · Flume: tail de app.log -> HDFS /nexo/bronze/logs/fecha=YYYY-MM-DD/
nexo.sources = tail
nexo.channels = mem
nexo.sinks = hdfs

nexo.sources.tail.type = TAILDIR
nexo.sources.tail.filegroups = app
nexo.sources.tail.filegroups.app = /tmp/flume/app_live.log
nexo.sources.tail.positionFile = /tmp/flume/taildir_position.json
nexo.sources.tail.channels = mem

nexo.channels.mem.type = memory
nexo.channels.mem.capacity = 10000
nexo.channels.mem.transactionCapacity = 500

nexo.sinks.hdfs.type = hdfs
nexo.sinks.hdfs.channel = mem
nexo.sinks.hdfs.hdfs.path = hdfs://namenode:8020/nexo/bronze/logs/fecha=%Y-%m-%d
nexo.sinks.hdfs.hdfs.useLocalTimeStamp = true
nexo.sinks.hdfs.hdfs.filePrefix = app
nexo.sinks.hdfs.hdfs.fileSuffix = .jsonl
nexo.sinks.hdfs.hdfs.fileType = DataStream
nexo.sinks.hdfs.hdfs.writeFormat = Text
nexo.sinks.hdfs.hdfs.batchSize = 50
nexo.sinks.hdfs.hdfs.rollInterval = 10
nexo.sinks.hdfs.hdfs.rollSize = 0
nexo.sinks.hdfs.hdfs.rollCount = 0
