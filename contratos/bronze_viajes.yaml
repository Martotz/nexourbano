# Contrato Bronze — viajes NexoUrbano (squad 2002)
# Columnas alineadas con data/viajes.csv generado con --seed 2002.
# Actualizar umbrales de "calidad" con lo medido en 01-discovery/perfilado.py.

dataset: bronze_viajes
version: 1.0.0
owner: Gabriel Donoso
grano: un viaje (ride_id)
timezone: UTC                # timestamps ISO-8601 con offset +00:00
formato: csv
encoding: utf-8
separador: ","
particionado: día de ingesta UTC (yyyy/mm/dd) en el Data Lake -> bronze/viajes/yyyy/mm/dd/   # la partición por fecha de viaje está en Silver (silver_viajes, columna fecha)
clave_primaria: ride_id
frescura_sla: batch diario 06:00 ART
fuentes:
  - generador sintético tools/generar_datos.py --seed 2002 --n-viajes 1000000
  - dataset abierto EcoBici (URL y fecha en data/abierto/MANIFIESTO_ecobici.json)

columnas:
  - {nombre: ride_id,       tipo: string,    nullable: false, ejemplo: T0000000}
  - {nombre: ts_start,      tipo: timestamp, nullable: false}
  - {nombre: ts_end,        tipo: timestamp, nullable: false}
  - {nombre: duration_s,    tipo: int,       nullable: false}
  - {nombre: rider_id,      tipo: string,    nullable: false, fk: riders.rider_id}
  - {nombre: vehicle_id,    tipo: string,    nullable: false, fk: vehiculos.vehicle_id}
  - {nombre: station_start, tipo: string,    nullable: false, fk: estaciones.station_id}
  - {nombre: station_end,   tipo: string,    nullable: false, fk: estaciones.station_id}
  - {nombre: barrio_start,  tipo: string,    nullable: true}
  - {nombre: barrio_end,    tipo: string,    nullable: true}
  - {nombre: lat_start,     tipo: double,    nullable: true, rango: [-35.0, -34.4]}
  - {nombre: lon_start,     tipo: double,    nullable: true, rango: [-58.6, -58.2]}
  - {nombre: lat_end,       tipo: double,    nullable: true, rango: [-35.0, -34.4]}
  - {nombre: lon_end,       tipo: double,    nullable: true, rango: [-58.6, -58.2]}
  - {nombre: km,            tipo: float,     nullable: true}
  - {nombre: fare_ars,      tipo: float,     nullable: true}
  - {nombre: clima_codigo,  tipo: int,       nullable: true, nota: "código WMO (Open-Meteo weathercode)"}

reglas_rechazo_silver:
  - duration_s < 30
  - duration_s > 14400
  - ts_end < ts_start
  - station_start o station_end nulos
  - fare_ars < 0
  - km = 0 con duration_s > 600   # distancia nula sospechosa (M7 Pig)

# Medido en 01-discovery/perfilado/sintetico_seed2002.md (1 000 000 filas):
#   nulos 0 % en todas las columnas · 0 ride_id duplicados · duration_s p50 243 s, p95 801 s, max 20 000 s
#   rechazos Silver: 13 392 (< 30 s) + 6 781 (> 4 h) + 9 (km = 0 con > 10 min) = 2,02 %
calidad:
  nulos_max_pct: 0.5          # medido 0 %: cualquier nulo es una regresión del productor
  duplicados_ride_id: 0
  rechazo_max_pct: 3          # medido 2,02 %: si supera 3 % se frena el pipeline
  late_data_horas: 24
