# Entorno local NexoUrbano — squad 2002
# Credenciales y puertos salen de .env (copiar .env.example -> .env).
#
#   docker compose up -d mysql mongo minio minio-init   # S1 / S2
#   docker compose up -d neo4j                          # S4
#   docker compose up -d cassandra                      # S4 (aparte si hay 8 GB de RAM)
#
# Hadoop/Hive/HBase: sandbox de la cátedra (ver 04-hadoop/README.md).
#
# Correcciones respecto al pack de cátedra:
#   - mysql: "3306:3307" -> "${MYSQL_PORT}:3306" (MySQL escucha en 3306 dentro del contenedor)
#   - mongo: "27018:27018" -> "${MONGO_PORT}:27017" (Mongo escucha en 27017 dentro del contenedor)
#   - contraseñas movidas a .env
#   - minio-init crea los buckets bronze/silver/gold

services:
  mysql:
    image: mysql:8.4
    container_name: nexo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?definir en .env}
      MYSQL_DATABASE: crm
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./data/mysql/crm_riders.sql:/docker-entrypoint-initdb.d/01_crm.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:8
    container_name: nexo-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./data:/import:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  cassandra:
    image: cassandra:5
    container_name: nexo-cassandra
    restart: unless-stopped
    ports:
      - "${CASSANDRA_PORT:-9042}:9042"
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./data:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15

  neo4j:
    image: neo4j:5-community
    container_name: nexo-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?definir en .env}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - ./data:/import:ro

  minio:
    image: minio/minio:latest
    container_name: nexo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?definir en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?definir en .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Crea los buckets bronze/silver/gold (layout igual al de ADLS Gen2) y termina.
  minio-init:
    image: minio/mc:latest
    container_name: nexo-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set nexo http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing nexo/bronze nexo/silver nexo/gold &&
      mc ls nexo
      "

volumes:
  mysql_data:
  mongo_data:
  cassandra_data:
  neo4j_data:
  minio_data:
