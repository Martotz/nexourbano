# Entorno local NexoUrbano — squad 2002
# Todo se maneja con .\run.ps1 (ver README). Credenciales en .env (run.ps1 setup lo crea).
#
# Perfiles (para no levantar todo junto con poca RAM):
#   (sin perfil)  mysql, mongo, minio, tools
#   hadoop        namenode, datanode, resourcemanager, nodemanager, hadoop-edge, hive, hbase
#   cassandra     cassandra
#   neo4j         neo4j
#
# Correcciones respecto al pack de cátedra:
#   - mysql: "3306:3307" -> "${MYSQL_PORT}:3306" (MySQL escucha en 3306 dentro del contenedor)
#   - mongo: "27018:27018" -> "${MONGO_PORT}:27017" (Mongo escucha en 27017 dentro del contenedor)
#   - contraseñas en .env, healthchecks, repo montado en /nexo en cada servicio

x-hadoop: &hadoop
  image: apache/hadoop:3.3.6
  env_file: ./docker/hadoop/config
  profiles: ["hadoop"]
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- base
  mysql:
    image: mysql:8.4
    container_name: nexo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?definir en .env}
      MYSQL_DATABASE: crm
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - ./data/mysql/crm_riders.sql:/docker-entrypoint-initdb.d/01_crm.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12

  mongo:
    image: mongo:8
    container_name: nexo-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./:/nexo
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  # MinIO retiró sus imágenes de Docker Hub y quay.io (2026): se usa la build de Chainguard.
  # Corre como root para poder escribir en el volumen (la imagen usa el usuario 65532 por defecto).
  # Los buckets bronze/silver/gold los crea 02-azure-datalake/subir_bronze.py.
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: nexo-minio
    restart: unless-stopped
    user: "0:0"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?definir en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?definir en .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Python + Java + Spark + drivers. Todo el código Python del TP corre acá.
  tools:
    build: ./docker/tools
    image: nexo-tools:1.0
    container_name: nexo-tools
    restart: unless-stopped
    env_file: .env
    environment:
      NEXO_LAKE: /nexo/lake
      MYSQL_HOST: mysql
      MONGO_URI: mongodb://mongo:27017
      CASSANDRA_HOST: cassandra
      NEO4J_URI: bolt://neo4j:7687
      MINIO_ENDPOINT: minio:9000
      HDFS_URI: hdfs://namenode:8020
    ports:
      - "4040:4040"     # Spark UI
    volumes:
      - ./:/nexo

  # ---------------------------------------------------------------- hadoop
  namenode:
    <<: *hadoop
    container_name: nexo-namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-hadoop/dfs/name
    ports:
      - "9870:9870"     # UI HDFS
    # HDFS es efímero a propósito: los scripts de S2 lo vuelven a poblar desde data/.

  datanode:
    <<: *hadoop
    container_name: nexo-datanode
    hostname: datanode
    command: ["hdfs", "datanode"]
    depends_on: [namenode]

  resourcemanager:
    <<: *hadoop
    container_name: nexo-resourcemanager
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    ports:
      - "8088:8088"     # UI YARN

  nodemanager:
    <<: *hadoop
    container_name: nexo-nodemanager
    hostname: nodemanager
    command: ["yarn", "nodemanager"]
    depends_on: [resourcemanager]

  # Cliente: hdfs dfs, MapReduce, Pig, Flume
  hadoop-edge:
    <<: *hadoop
    build: ./docker/hadoop
    image: nexo-hadoop-edge:1.0
    container_name: nexo-hadoop-edge
    hostname: edge
    command: ["sleep", "infinity"]
    depends_on: [namenode, datanode, resourcemanager]
    volumes:
      - ./:/nexo

  hive:
    image: apache/hive:4.0.1
    container_name: nexo-hive
    profiles: ["hadoop"]
    restart: unless-stopped
    depends_on: [namenode, datanode]
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: >-
        -Dhive.metastore.warehouse.dir=hdfs://namenode:8020/user/hive/warehouse
        -Dmetastore.warehouse.dir=hdfs://namenode:8020/user/hive/warehouse
        -Dhive.exec.dynamic.partition.mode=nonstrict
    ports:
      - "10000:10000"   # HiveServer2 JDBC
      - "10002:10002"   # UI
    volumes:
      - ./:/nexo

  hbase:
    image: harisekhon/hbase:2.1
    container_name: nexo-hbase
    hostname: hbase
    profiles: ["hadoop"]
    restart: unless-stopped
    ports:
      - "16010:16010"   # UI HBase Master
    volumes:
      - ./:/nexo

  # ---------------------------------------------------------------- nosql
  cassandra:
    image: cassandra:5
    container_name: nexo-cassandra
    profiles: ["cassandra"]
    restart: unless-stopped
    ports:
      - "${CASSANDRA_PORT:-9042}:9042"
    environment:
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./:/nexo
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20

  neo4j:
    image: neo4j:5-community
    container_name: nexo-neo4j
    profiles: ["neo4j"]
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?definir en .env}
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - ./data:/var/lib/neo4j/import
      - ./:/nexo
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  mongo_data:
  minio_data:
  cassandra_data:
  neo4j_data:
